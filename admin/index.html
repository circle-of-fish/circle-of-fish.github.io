<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>편집 · Circle of the Fish</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Spectral:wght@500;600&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <div class="brand">
      <span class="brand-mark">Circle of the Fish</span>
      <span class="brand-sub">편집</span>
    </div>
    <nav class="tabs" id="tabs" hidden>
      <button data-file="publications" class="on">출판</button>
      <button data-file="seminars">세미나</button>
      <button data-file="members">구성원</button>
      <button data-file="resources">자료·링크</button>
    </nav>
    <div class="bar-right">
      <span class="who" id="who" hidden></span>
      <span class="dirty" id="dirty" hidden>저장하지 않은 변경</span>
      <button id="save" class="btn primary" disabled>저장</button>
      <button id="pw" class="btn quiet" hidden>비밀번호</button>
      <button id="signout" class="btn quiet" hidden>나가기</button>
    </div>
  </div>
</header>

<!-- ── 로그인 ─────────────────────────────────────────────── -->
<section class="gate" id="gate">
  <div class="gate-box">
    <h1>편집</h1>
    <p class="lead">복어회 구성원 계정으로 들어오십시오.</p>
    <form id="gate-form">
      <label class="field">
        <span class="label">아이디</span>
        <input type="text" id="username" autocomplete="username" spellcheck="false" autocapitalize="off" required>
      </label>
      <label class="field">
        <span class="label">비밀번호</span>
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <label class="check"><input type="checkbox" id="remember"> 이 브라우저에 기억</label>
      <button class="btn primary" type="submit" id="gate-go">들어가기</button>
      <p class="err" id="gate-err" hidden></p>
    </form>
    <p class="fine">
      아이디와 임시 비밀번호는 간사에게 받으십시오. 처음 들어오면 비밀번호를 바꾸게 됩니다.
      공용 컴퓨터라면 “이 브라우저에 기억”을 켜지 마십시오.
    </p>
  </div>
</section>

<!-- ── 비밀번호 변경 ──────────────────────────────────────── -->
<section class="gate" id="pwgate" hidden>
  <div class="gate-box">
    <h1 id="pw-title">비밀번호 바꾸기</h1>
    <p class="lead" id="pw-lead">처음 들어오셨습니다. 쓰시던 임시 비밀번호를 바꿔 주십시오.</p>
    <form id="pw-form">
      <label class="field">
        <span class="label">현재 비밀번호</span>
        <input type="password" id="pw-current" autocomplete="current-password" required>
      </label>
      <label class="field">
        <span class="label">새 비밀번호</span>
        <input type="password" id="pw-next" autocomplete="new-password" minlength="12" required>
      </label>
      <label class="field">
        <span class="label">새 비밀번호 다시</span>
        <input type="password" id="pw-again" autocomplete="new-password" minlength="12" required>
      </label>
      <div class="note">열두 자 이상. 다른 곳에 쓰지 않는 것으로 정해 주십시오.</div>
      <p></p>
      <button class="btn primary" type="submit">바꾸기</button>
      <button class="btn" type="button" id="pw-cancel" hidden>그만두기</button>
      <p class="err" id="pw-err" hidden></p>
    </form>
  </div>
</section>

<!-- ── 편집 ───────────────────────────────────────────────── -->
<main id="app" hidden>
  <div class="toolbar">
    <select id="group-filter"></select>
    <select id="member-filter" hidden></select>
    <input type="search" id="search" placeholder="찾기">
    <span class="count" id="count"></span>
    <button class="btn" id="add">+ 새 항목</button>
  </div>

  <div class="split">
    <ul class="list" id="list"></ul>
    <div class="pane" id="pane">
      <p class="empty">왼쪽에서 항목을 고르거나 <b>새 항목</b>을 누르십시오.</p>
    </div>
  </div>
</main>

<div class="toast" id="toast" hidden></div>

<script src="admin.js"></script>
</body>
</html>
