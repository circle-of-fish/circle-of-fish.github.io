name: Rebuild site

# Editors change data/*.json through /admin/ (or by hand); this turns that back
# into the published HTML. It only fires on source paths, so the commit it
# makes — which touches built pages only — cannot re-trigger it.
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'templates/**'
      - 'assets/**'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet jinja2

      - name: Build
        run: python build.py

      - name: Commit the rebuilt pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Data changed but the rendered pages did not."
            exit 0
          fi
          git commit -m "Rebuild the site from data

          Regenerated by .github/workflows/build.yml after a change to the
          content sources."
          git push
